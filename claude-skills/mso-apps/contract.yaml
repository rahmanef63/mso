version: 1
routing:
  use_when:
    - "operate managed apps on the VPS"
  do_not_use_when:
    - "A narrower official MSO skill exactly matches the requested task."
  fallback: false
context:
  target: managed-app
  mode: mixed
  actor: operator
lifecycle:
  discover:
    - apps_list
  validate:
    - managed-app-policy
  verify:
    - apps_status
state:
  source_of_truth: live
  refresh: before-write
safety:
  risk: medium
  confirmation: contextual
  concurrency: contextual
presentation:
  authority: hybrid
