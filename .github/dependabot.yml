version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Major toolchain updates stay opt-in until the complete repository gate passes
    # against the matching Next.js/typescript-eslint plugin stack. This prevents
    # Dependabot from repeatedly reopening known-incompatible PRs while minor/patch
    # and security updates continue normally.
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Typings track the supported runtime baseline in .nvmrc, not latest Node.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      test-toolchain:
        patterns:
          - vitest
          - "@vitest/*"
        update-types:
          - major
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        exclude-patterns:
          - vitest
          - "@vitest/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  # Isolated native build tool: all transitives are locked, separate from MSO's Bun tree.
  - package-ecosystem: npm
    directory: /scripts/install/node-gyp
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    # 13.x requires Node ^22.22.2 || ^24.15.0 || >=26, narrower than ^22.12.0.
    # 12.4.0 stays inside that floor and drops http-cache-semantics.
    ignore:
      - dependency-name: node-gyp
        update-types:
          - version-update:semver-major
