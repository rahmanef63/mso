name: Changelog autoregen

# docs/CHANGELOG.md is DERIVED from `git log` (scripts/gen-changelog.mjs), so it can only be
# correct AFTER the commits it lists exist. `bun run ship` regenerates it before pushing, but a
# PR merged from the GitHub UI never runs `ship`: main lands one commit stale and the CI
# "Verify" job (`bun run check` -> `gen-changelog --check`) goes red immediately. This repairs
# that on main instead of asking every merger to remember.
#
# Deliberately NOT `bun run ship`: ship builds and restarts the production runtime on the owner
# host. A hosted runner must never do that. This workflow touches docs/CHANGELOG.md and nothing
# else.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Repository default is `contents: read`; the commit+push below needs write.
# `actions: write` is what the final `gh workflow run ci.yml` (workflow_dispatch) needs. A push
# made with the default GITHUB_TOKEN does NOT retrigger workflows, so without this dispatch the
# repaired HEAD would keep showing the old red Verify from the pre-bot merge commit.
permissions:
  contents: write
  actions: write

concurrency:
  # Serialize, never cancel: two merges seconds apart must both regenerate. Cancelling the
  # first would drop its changelog line, and a mid-flight cancel can leave a non-fast-forward
  # push behind.
  group: changelog-autoregen
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Loop guard: the bot's own commit arrives as a push on main and would re-run this. Its
    # regeneration commit is already the output, so there is nothing to repair. (The generator
    # also skips `docs(changelog)` subjects, so that commit adds no line to itself.)
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the generator builds the changelog from `git log`. fetch-depth 1
          # would write a one-commit changelog and then fail its own `--check`.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Regenerate and push if stale
        id: regen
        shell: bash
        run: |
          set -euo pipefail
          node scripts/gen-changelog.mjs
          if git diff --quiet -- docs/CHANGELOG.md; then
            echo "changelog current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CHANGELOG.md
          git commit -m "docs(changelog): regenerate after merge"
          # `concurrency` above only serialises THIS workflow's own runs. A human merge or another
          # bot can push to main between our checkout and our push, which rejects the push as
          # non-fast-forward and leaves the run red without repairing anything. Rebase onto the
          # new main and retry a bounded number of times instead.
          pushed=0
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              pushed=1
              break
            fi
            echo "push attempt ${attempt}/3 failed; retrying after 3s"
            sleep 3
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::could not push the regenerated changelog after 3 attempts; main is still stale"
            exit 1
          fi
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      # Only dispatch when this run actually pushed: a push made with the default GITHUB_TOKEN
      # does not retrigger workflows, so the new HEAD would otherwise keep the stale red Verify.
      - name: Re-run Verify on the repaired HEAD
        if: steps.regen.outputs.pushed == 1
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref main
