name: CodeQL

on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:javascript-typescript
          output: ${{ runner.temp }}/mso-codeql-results

      - name: Report every result from this exact CodeQL analysis
        run: node scripts/codeql-report.mjs "$RUNNER_TEMP/mso-codeql-results"

      # Report-only here on purpose. The failing gate for open findings is security-alerts.yml, and
      # having this step fail too made a closed loop: one open alert turned the analysis run red,
      # Scorecard then counted that commit as not SAST-checked, and its SASTID alert stayed open --
      # which kept this step red. The analysis job's output is SARIF; the gate belongs in one place.
      - name: Inspect actual CodeQL branch findings after SARIF processing
        if: github.event_name == 'push'
        run: node scripts/security-alerts.mjs --inventory --tool CodeQL --include-closed --ref "$GITHUB_REF" --commit "$GITHUB_SHA" --wait-seconds 60
        env:
          GITHUB_TOKEN: ${{ github.token }}
