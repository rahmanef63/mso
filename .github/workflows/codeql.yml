name: CodeQL

on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:javascript-typescript
          output: ${{ runner.temp }}/mso-codeql-results

      - name: Report every result from this exact CodeQL analysis
        run: node scripts/codeql-report.mjs "$RUNNER_TEMP/mso-codeql-results"

      - name: Inspect actual branch findings after SARIF processing
        if: github.event_name == 'push'
        run: node scripts/security-alerts.mjs --include-closed --ref "$GITHUB_REF"
        env:
          GITHUB_TOKEN: ${{ github.token }}
