name: Security Core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan all Git history including merge diffs
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --network=none \
            --cap-drop=ALL --security-opt=no-new-privileges --read-only \
            -v "$PWD:/repo:ro" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --redact --log-opts="--all --full-history --diff-merges=first-parent" \
            --gitleaks-ignore-path /repo/.gitleaksignore /repo

  trivy:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan vulnerabilities, misconfigurations and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: cyclonedx
          output: mso.cdx.json
          exit-code: "0"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mso-cyclonedx-sbom
          path: mso.cdx.json
          retention-days: 14

  osv:
    name: OSV dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan lockfiles with OSV-Scanner 2.5.1
        run: >-
          docker run --rm -v "$PWD:/src:ro"
          ghcr.io/google/osv-scanner@sha256:8108ae94eadea5a02c9bec6e646909d5b790b44bd62d7f5b7f0b1d6d0ffc7734
          scan source --recursive /src

  semgrep:
    name: Semgrep OWASP/SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan JavaScript/TypeScript and OWASP rules
        run: >-
          docker run --rm -v "$PWD:/src:ro"
          semgrep/semgrep@sha256:f1f7b71861c7b28b6e0f661225a2c4f58a484f5d0f182465c6d6b3b22f972ade
          semgrep scan --metrics=off
          --config=p/javascript --config=p/typescript --config=p/owasp-top-ten
          --error /src

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tracked shell entrypoints
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git grep -Il '^#!.*sh' -- '*.sh' 'bin/*' 'scripts/*' 'claude-skills/*' || true)
          args=()
          for file in "${files[@]}"; do args+=("/src/$file"); done
          ((${#args[@]} > 0)) || { echo "No shell entrypoints found"; exit 0; }
          docker run --rm -v "$PWD:/src:ro" \
            koalaman/shellcheck-alpine@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002 \
            shellcheck --severity=warning -e SC1090,SC2034 "${args[@]}"
