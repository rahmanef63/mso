name: CI

on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate native dependency
        run: node -e "require('node-pty')"

      - name: Validate installer syntax
        run: bash -n scripts/install.sh && bash -n scripts/install-core.sh

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Provision local Forge sandbox
        run: bash scripts/provision-forge-sandbox.sh

      - name: Tests and coverage
        run: |
          set -euo pipefail
          test ! -e .env.local
          umask 077
          printf '# Synthetic denylist fixture; no credentials.\n' > .env.local
          trap 'rm -f .env.local' EXIT
          bun run coverage

      - name: Repository checks
        run: bun run check

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Production build
        run: bun run build

      - name: Install browser
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Required browser journeys
        run: bun run e2e:release

  dependency-watch:
    name: Scheduled dependency audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run audit:strict
