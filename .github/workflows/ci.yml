name: CI

on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: `bun run check` includes `gen-changelog --check`, which rebuilds the
          # changelog from `git log`. The default fetch-depth of 1 hides all but the newest
          # commit, so that gate sees a one-line history and fails every run — a false red
          # that reads exactly like a stale file.
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install isolated Svelte dependencies
        run: bun run svelte:install

      - name: Check and build isolated Svelte entry
        run: bun run svelte:check && bun run svelte:build && bun run svelte:audit:strict

      - name: Validate native dependency
        run: node -e "require('node-pty')"

      - name: Validate installer syntax
        run: bash -n scripts/install.sh && bash -n scripts/install-core.sh

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Provision local Forge sandbox
        run: bash scripts/provision-forge-sandbox.sh

      - name: Tests and coverage
        run: bun run coverage

      - name: Repository checks
        run: bun run check

      # Single audit entry point: scripts/audit.mjs owns the one waiver map.
      - name: Audit dependencies
        run: bun run audit:strict

      - name: Audit locked native build tool
        run: node scripts/audit-native-tool.mjs

      - name: Production build
        run: bun run build
        env:
          # Matches the isolated local build; never uses a maintainer hostname.
          NEXT_PUBLIC_MANAGED_APP_HOST_TEMPLATE: "{id}.mso.example.com"

      - name: Install browser
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Svelte 5 browser journeys
        run: bun run svelte:e2e

  native-host:
    name: Native host (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build directly on host
        run: node scripts/install-native.mjs

      - name: Health check on loopback
        run: node scripts/native-host-smoke.mjs

  dependency-watch:
    name: Scheduled dependency audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run audit:strict
      - run: node scripts/audit-native-tool.mjs
