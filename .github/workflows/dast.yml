name: OWASP ZAP Baseline

on:
  schedule:
    - cron: "13 5 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-production-baseline
  cancel-in-progress: false

jobs:
  baseline:
    name: Passive production baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed ZAP policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run passive ZAP baseline against maintained live instance
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://mso.rahmanef.com
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
          rules_file_name: security/zap-baseline.conf
          cmd_options: -m 2
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-report
