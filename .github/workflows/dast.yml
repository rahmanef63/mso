name: OWASP ZAP Baseline

on:
  schedule:
    - cron: "13 5 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-production-baseline
  cancel-in-progress: false

jobs:
  baseline:
    name: Passive production baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed ZAP policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run passive ZAP baseline against maintained live instance
        uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874 # v0.15.0
        with:
          target: https://mso.rahmanef.com
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
          rules_file_name: security/zap-baseline.conf
          cmd_options: -m 2
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-report
