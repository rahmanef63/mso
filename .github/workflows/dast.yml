name: OWASP ZAP Baseline

on:
  schedule:
    - cron: "13 5 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-production-baseline
  cancel-in-progress: false

jobs:
  baseline:
    name: Passive production baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed ZAP policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Require an explicit passive scan target
        run: node scripts/check-dast-target.mjs
        env:
          MSO_DAST_URL: ${{ vars.MSO_DAST_URL }}

      - name: Run passive ZAP baseline against configured live instance
        id: zap
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.MSO_DAST_URL }}
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
          rules_file_name: security/zap-baseline.conf
          # The pinned action forwards rules_file_name only for IGNORE entries.
          # Pass the existing INFO-only policy explicitly. fail_action=false preserves
          # the raw JSON for path-scoped review; the next step is the fail-closed gate.
          cmd_options: -m 2 -c security/zap-baseline.conf
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Require only reviewed passive findings
        if: ${{ always() }}
        run: node scripts/check-zap-report.mjs report_json.json "${{ steps.zap.outcome }}"
        env:
          MSO_DAST_URL: ${{ vars.MSO_DAST_URL }}
