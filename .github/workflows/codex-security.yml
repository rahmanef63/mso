name: Codex Security Components

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-security-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: Component security scan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      CODEX_SECURITY_VERSION: "0.1.21"
      CODEX_SECURITY_AUTH: api-key
      CODEX_SECURITY_FAIL_ON_SEVERITY: high
      CODEX_SECURITY_COMPONENT_WORKERS: "2"
      CODEX_SECURITY_COMPONENT_MAX_COST_USD: "8"
      CODEX_SECURITY_MODEL: "gpt-5.6-terra"
      CODEX_SECURITY_EFFORT: "high"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.0"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check scan credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" && -z "${CODEX_API_KEY:-}" ]]; then
            echo "::error::Set OPENAI_API_KEY or CODEX_API_KEY as a repository or organization Actions secret."
            exit 2
          fi

      - name: Run Codex Security component gate
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_SECURITY_STATE_DIR="$RUNNER_TEMP/codex-security-state"
          export CODEX_SECURITY_OUTPUT_ROOT="$RUNNER_TEMP/codex-security-results"
          stdout_file="$RUNNER_TEMP/codex-security.stdout"
          stderr_file="$RUNNER_TEMP/codex-security.stderr"
          cleanup() { rm -rf "$CODEX_SECURITY_STATE_DIR" "$CODEX_SECURITY_OUTPUT_ROOT" "$stdout_file" "$stderr_file"; }
          trap cleanup EXIT

          set +e
          ./scripts/codex-security-components.sh >"$stdout_file" 2>"$stderr_file"
          status=$?
          set -e

          case "$status" in
            0) echo "Codex Security component gate passed." ;;
            1) echo "::error::Codex Security found a High/Critical vulnerability group. Review private local artifacts." ;;
            *) echo "::error::Codex Security component coverage or matching did not complete (exit $status). Review private local diagnostics." ;;
          esac
          exit "$status"
