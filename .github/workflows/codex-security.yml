name: Codex Security

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Scan mode
        required: true
        default: standard
        type: choice
        options:
          - standard
          - deep

permissions:
  contents: read

concurrency:
  group: codex-security-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      CODEX_SECURITY_VERSION: "0.1.18"
      CODEX_SECURITY_AUTH: api-key
      CODEX_SECURITY_MODE: ${{ inputs.mode }}
      CODEX_SECURITY_FAIL_ON_SEVERITY: high
      CODEX_SECURITY_MAX_COST_USD: "5"
      CODEX_SECURITY_MAX_TIME_HOURS: "1.5"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.0"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check scan credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" && -z "${CODEX_API_KEY:-}" ]]; then
            echo "::error::Set OPENAI_API_KEY or CODEX_API_KEY as a repository or organization Actions secret."
            exit 2
          fi

      - name: Run Codex Security
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_SECURITY_STATE_DIR="$RUNNER_TEMP/codex-security-state"
          export CODEX_SECURITY_OUTPUT_ROOT="$RUNNER_TEMP/codex-security-results"
          stdout_file="$RUNNER_TEMP/codex-security.json"
          stderr_file="$RUNNER_TEMP/codex-security.log"
          cleanup() { rm -rf "$CODEX_SECURITY_STATE_DIR" "$CODEX_SECURITY_OUTPUT_ROOT" "$stdout_file" "$stderr_file"; }
          trap cleanup EXIT

          set +e
          CI=true ./scripts/codex-security-scan.sh >"$stdout_file" 2>"$stderr_file"
          status=$?
          set -e

          case "$status" in
            0) echo "Codex Security passed." ;;
            1) echo "::error::Codex Security found a high-or-critical vulnerability. Re-run locally to review the private finding details." ;;
            *) echo "::error::Codex Security did not complete successfully (exit $status). Re-run locally for private diagnostics." ;;
          esac
          exit "$status"
